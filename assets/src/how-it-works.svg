<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="700" viewBox="0 0 1800 700">
  <title>Blur Studio: the photo goes through shadow, blur and glass passes once for each panel, and the same passes make the preview and the export</title>
  <defs>
    <marker id="head" viewBox="0 0 20 20" refX="18" refY="10" markerWidth="20" markerHeight="20" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M4 3 L18 10 L4 17" fill="none" stroke="#6E8BFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1800" height="700" fill="#0B0C14"/>

  <g font-family="Instrument Sans" fill="#EEF1FF">
    <!-- Cards -->
    <g fill="#151827" stroke="#262B45" stroke-width="2">
      <rect x="50" y="230" width="300" height="160" rx="18"/>
      <rect x="470" y="230" width="250" height="160" rx="18"/>
      <rect x="760" y="230" width="250" height="160" rx="18"/>
      <rect x="1050" y="230" width="260" height="160" rx="18"/>
      <rect x="1440" y="140" width="310" height="150" rx="18"/>
      <rect x="1440" y="330" width="310" height="150" rx="18"/>
    </g>

    <!-- The per-panel loop -->
    <rect x="440" y="150" width="900" height="350" rx="26" fill="none" stroke="#6E8BFF" stroke-width="2.5"/>
    <text x="470" y="200" font-family="IBM Plex Mono" font-size="22" letter-spacing="3" fill="#6E8BFF">FOR EACH PANEL, IN ORDER</text>

    <g font-size="40" font-weight="600">
      <text x="78" y="298">Your photo</text>
      <text x="498" y="298">Shadow</text>
      <text x="788" y="298">Blur</text>
      <text x="1078" y="298">Glass</text>
      <text x="1468" y="203">Preview</text>
      <text x="1468" y="393">Export</text>
    </g>
    <g font-size="26" fill-opacity="0.6">
      <text x="78" y="346">stays in the browser</text>
      <text x="498" y="346">under the panel</text>
      <text x="788" y="346">what is behind it</text>
      <text x="1078" y="346">bend, rim, glare</text>
      <text x="1468" y="251">fitted to the window</text>
      <text x="1468" y="441">at the photo's full size</text>
    </g>

    <!-- Arrows -->
    <g fill="none" stroke="#6E8BFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M360 310 H430" marker-end="url(#head)"/>
      <path d="M730 310 H750" marker-end="url(#head)"/>
      <path d="M1020 310 H1040" marker-end="url(#head)"/>
      <!-- Back round to the next panel, over the scene so far. -->
      <path d="M1180 390 V440 Q1180 452 1168 452 H607 Q595 452 595 440 V400" marker-end="url(#head)"/>
      <!-- One result, two sizes. -->
      <path d="M1350 310 H1390"/>
      <path d="M1390 215 V405"/>
      <path d="M1390 215 H1430" marker-end="url(#head)"/>
      <path d="M1390 405 H1430" marker-end="url(#head)"/>
    </g>
    <text x="890" y="484" text-anchor="middle" font-family="IBM Plex Mono" font-size="20" letter-spacing="3" fill="#6E8BFF">NEXT PANEL SEES THE GLASS SO FAR</text>

    <text x="900" y="608" text-anchor="middle" font-family="IBM Plex Mono" font-size="22" letter-spacing="3" fill="#EEF1FF" fill-opacity="0.45">SAME SHADERS AND SAME IMAGE-PIXEL UNITS FOR BOTH</text>
  </g>
</svg>
